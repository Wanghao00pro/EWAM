# EWAM finetune on LIBERO: HORIZONTAL image concat + UnifyTo16 dim16 + action-loss dim mask.
#
# Image: agentview | wrist side-by-side (horizontal) instead of T-shape. Model:
# Ewam (plain flow-matching loss), dim16 action/state, stage-1 pretrain checkpoint.
#
# - Image: runtime horizontal concat (image_concat_mode: "horizontal"), 224x448
#   agentview | wrist side-by-side, each resized to [H,W], concat to [H,2W], final resize to [H,W]
# - Data: all 4 LIBERO suites from /path/to/libero_lerobot, min/max normalization [-1,1]
# - Dims: action_dim=16 / state_dim=16 (padded from LIBERO 7/8 via UnifyTo16), matching the
#   pretrain checkpoint (state_encoder/action_encoder/action_head all 16-D).
# - Loss: action MSE masked over valid 7 dims (pad dims excluded) via action_dim_is_pad.
# - Finetune: loads pretrain ckpt (filters input_encoder/decoder, re-inits them at dim16).
# - Entry: train/train_ewam.py -> models.ewam.Ewam
#
# NOTE: WAN VAE downsamples by 32x, so latent = (H//32, W//32) = (7, 14) for 224x448.
#       The WAN transformer is sequence-based and accepts any token count, so switching image
#       size from t_shape's 384x320 (latent 12x10) to 224x448 (latent 7x14) does NOT require
#       retraining the backbone or re-initializing pos embeddings. load_pretrain_weights only
#       filters action_expert.input_encoder/decoder; WAN/VLM backbone weights load normally.

common:
  action_dim: 16        # Padded (UnifyTo16); valid LIBERO dims = 7
  state_dim: 16         # Padded (UnifyTo16); valid LIBERO dims = 8
  num_video_frames: 8
  video_height: 224     # Horizontal: [224, 448]
  video_width: 448
  global_downsample_rate: 1
  video_action_freq_ratio: 2   # action_chunk_size = 8 * 2 = 16 (matches pretrain pos_embedding 22 = 16+1+4)

dataset:
  type: "libero_lerobot"

  # LeRobot format dataset directories - all 4 LIBERO suites
  dataset_dirs:
    - "/path/to/libero_lerobot/libero_object_no_noops_lerobot"
    - "/path/to/libero_lerobot/libero_10_no_noops_lerobot"
    - "/path/to/libero_lerobot/libero_goal_no_noops_lerobot"
    - "/path/to/libero_lerobot/libero_spatial_no_noops_lerobot"

  suite_names:
    - "libero_object"
    - "libero_10"
    - "libero_goal"
    - "libero_spatial"
  task_name: null  # Use all tasks

  suite_weights: null
  balance_suites: false
  max_episodes: null
  image_aug: false
  use_eye_in_hand: false
  use_normalization: true  # Normalize to [-1,1] (min/max)
  image_concat_mode: "horizontal"  # Side-by-side concat (agentview | wrist)
  unify_to_16: true  # Pad action 7->16, state 8->16; emit action_dim_is_pad for loss masking

model:
  wan:
    config_path: "/path/to/ewam_weights/Wan2.2-TI2V-5B"
    checkpoint_path: "/path/to/ewam_weights/Wan2.2-TI2V-5B"
    vae_path: "/path/to/ewam_weights/Wan2.2-TI2V-5B/Wan2.2_VAE.pth"
    precision: "bfloat16"

  vlm:
    checkpoint_path: "/path/to/ewam_weights/Qwen3-VL-2B-Instruct"
    precision: "bfloat16"
    frozen: false  # VLM is trainable for direct MoT

  # Qwen3-VL Expert settings (per-layer QKV projections for direct MoT)
  qwen3_expert:
    vlm_dim: 2048              # Qwen3-VL-2B hidden size
    head_dim: 128              # Head dimension (matches WAN 5B)
    num_heads: 24              # Number of heads (matches WAN 5B)
    num_layers: 30             # Number of layers (matches WAN)
    norm_eps: 1e-5

  action_expert:
    hidden_size: 1024
    ffn_dim_multiplier: 4
    norm_eps: 1e-5

  # Training mode: finetune (state+action) for LIBERO
  training_mode: "finetune"

  time_distribution:
    timestep_sample_method: "logit_normal"
    sigmoid_scale: 1.0
    min_t: 0.0
    max_t: 1.0

  inference:
    num_inference_timesteps: 10

  loss_weights:
    video_loss_weight: 1.0
    action_loss_weight: 1.0

  # Plain uniform-mean-MSE flow-matching loss (the pipeline the LIBERO results use).
  # Set true for the reweighted-loss variant.
  loss_reweight: false

  ema:
    enabled: false
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999

training:
  batch_size: 8
  max_steps: 120000
  learning_rate: 5.0e-5
  wan_learning_rate: 5.0e-5   # WAN backbone LR
  vlm_learning_rate: 5.0e-5    # VLM LR
  weight_decay: 0.01
  gradient_accumulation_steps: 1

  scheduler_type: "linear"
  warmup_steps: 200
  cycle_length: 5000000
  f_max: 0.99
  f_min: 0.4

  grad_clip_norm: 0.5
  use_amp: true
  find_unused_parameters: false

system:
  checkpoint_dir: "/path/to/ewam/checkpoints_libero"
  log_level: "INFO"

  log_interval: 10
  save_interval: 20000
  val_interval: 5000

  num_workers: 16
  pin_memory: true

logging:
  report_to: "tensorboard"
  wandb_project: "ewam-libero-stage2-dim16"
  tensorboard_log_dir: "/path/to/ewam/tensorboard_libero"
  run_name: null

resume:
  checkpoint_path: null

finetune:
  # Pre-trained EWAM checkpoint (stage-1 multi-source pretrain, dim16)
  # load_pretrain_weights filters action_expert.input_encoder/decoder (re-init at dim16).
  checkpoint_path: "/path/to/ewam_weights/pretrain/pytorch_model"
